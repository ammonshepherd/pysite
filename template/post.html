<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PySite: Python Based Static Site Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <div class="logo">
        <img alt="A python driving a Chevy Chevelle SS" src="/public/images/pysite-logo.webp">
    </div>
    <main>

        {> CONTENT <}

    </main>
    <div class="post_nav">
        <nav>
            {% if prev_post_url %}
                Previous Entry: <a href="{{ prev_post_url }}">← {{ prev_post_title }}</a>
            {% endif %}
            
            {% if next_post_url %}
                Next Entry: <a href="{{ next_post_url }}">{{ next_post_title }} →</a>
            {% endif %}
        </nav>
    </div>
</body>
</html>
